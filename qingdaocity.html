<!DOCTYPE html>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const cards = document.querySelectorAll(".card, .card2");
        const largeImageContainer = document.getElementById("large-image-container");
        const largeImage = document.getElementById("large-image");
    
        cards.forEach(card => {
            card.addEventListener("mouseenter", function () {
                const imgElement = card.querySelector("img");
                if (imgElement) {
                    largeImage.src = imgElement.src; // 更新大图
                    largeImageContainer.style.display = "flex"; // 显示大图容器
                }
            });
    
            card.addEventListener("mouseleave", function () {
                largeImageContainer.style.display = "none"; // 隐藏大图
            });
        });
    });
    document.addEventListener("DOMContentLoaded", function () {
    // 读取 localStorage 以恢复展开状态
    document.querySelectorAll("details").forEach(detail => {
        const id = detail.id;
        if (id && localStorage.getItem(id) === "open") {
            detail.setAttribute("open", "true");
        }
    });

    // 监听 <details> 的展开和折叠，并存储状态
    document.querySelectorAll("details").forEach(detail => {
        detail.addEventListener("toggle", function () {
            const id = detail.id;
            if (id) {
                if (detail.open) {
                    localStorage.setItem(id, "open");
                } else {
                    localStorage.removeItem(id);
                }
            }
        });
    });
});

</script>
