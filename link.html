<body id="home">
    <header>

        </div>
        <nav>

        </div>
    </div>

    </footer>

</html>
<script>
     function search() {
            let keyword = document.getElementById("searchInput").value.trim();
            let searchMap = {
                "资源中心": "resource.html",
                "应用场景": "application.html",
                "北京": "beijing.html",
                "上海": "shanghai.html",
                "天津": "tianjin.html",
                "重庆": "chongqing.html",
                "海口": "haikou.html",
                "深圳": "shenzhen.html",
                "广州": "guangzhou.html",
                "厦门": "xiamen.html",
                "福州": "fuzhou.html",
                "杭州": "hangzhou.html",
                "南京": "nanjing.html",
                "长沙": "changsha.html",
                "武汉": "wuhan.html",
                "昆明": "kunming.html",
                "贵阳": "guiyang.html",
                "南宁": "nanning.html",
                "南昌": "nanchang.html",
                "成都": "chengdu.html",
                "西安": "xian.html",
                "合肥": "hefei.html",
                "济南": "jinan.html",
                "太原": "taiyuan.html",
                "郑州": "zhengzhou.html",

                "乌鲁木齐": "wulumuqi.html",

                "宁波": "ningbo.html",
                "青岛": "qingdao.html",
                "大连": "dalian.html",
                "拉萨": "lasa.html",
                "铁路": "train.html",
                "公路": "road.html"
            };

            if (keyword in searchMap) {
                window.location.href = searchMap[keyword];
            } else {
                alert("未找到相关城市，请重新输入城市名");
            }
        }
        document.getElementById("searchInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {  // 检测是否按下回车键
        search();  // 调用搜索函数
    }
});
</script>
